test:
  name: Pattern HTML files, resources by convention, JS and CSS auto-bundling
  comment: >
    HTML pattern files in patterns/{category}/{id}.html are parsed and exposed
    in the style context. Associated CSS and JS are discovered by convention.
    CSS is @layer-wrapped. JS is copied individually.
  action:
    wig: build
input:
  files:
    data:
      site.yaml: |
        url: localhost
      document.yaml: |
        style: default
        layout: page.html
    styles:
      default:
        style.yaml: |
          name: default
        templates:
          layouts:
            page.html: |
              <link rel="stylesheet" t-var:href="document.style.css.path" />
              <p><t-var name="document.style.patterns.blocks.widget.name" /></p>
              <t-slot />
        patterns:
          globals:
            surface.html: |
              ---
              name: Surface
              ---
          blocks:
            widget.html: |
              ---
              name: Widget
              description: A block pattern.
              ---
              <div class="widget">Example</div>

              <!-- variant: alt -->
              <div class="widget" data-variant="alt">Alt</div>
        css:
          globals:
            surface.css: |
              .surface { color: green; }
          blocks:
            widget.css: |
              .widget { display: block; }
        js:
          blocks:
            widget.js: |
              console.log("widget");
    pages:
      _index.dj: |
        ---
        ---
        Hi.
output:
  files:
    index.html: true
    assets:
      css:
        styles:
          default.*.css: true
