test:
  name: Nested bundle paths, optional JS bundle, pattern YAML manifests
  action:
    wig: build
input:
  files:
    data:
      site.yaml: |
        url: localhost
      document.yaml: |
        style: default
        layout: page.html
    styles:
      default:
        style.yaml: |
          name: default
          bundles:
            css:
              nested/demo:
                - css/nested.css
              surface:
                - css/surface.css
            js:
              app:
                - js/app.js
        templates:
          layouts:
            page.html: |
              <link rel="stylesheet" t-var:href="assets.default.css.nested.demo.path" />
              <link rel="stylesheet" t-var:href="assets.default.css.surface.path" />
              <script t-var:src="assets.default.js.app.path"></script>
              <p><t-var name="document.style.patterns.blocks.widget.name" /></p>
              <t-slot />
        data:
          patterns:
            blocks:
              widget.yaml: |
                name: Widget
                description: A block pattern.
                example: "<div class=\"widget\" />"
                variants: []
        css:
          nested.css: |
            .nested { display: block; }
          surface.css: |
            .surface { color: green; }
        js:
          app.js: |
            console.log("app");
    pages:
      _index.dj: |
        ---
        ---
        Hi.
output:
  files:
    index.html: true
    assets:
      default:
        css:
          nested:
            demo.*.css: |
              .nested { display: block; }
          surface.*.css: |
              .surface { color: green; }
        js:
          app.*.js: |
            console.log("app");
