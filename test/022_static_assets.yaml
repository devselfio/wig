test:
  name: Static file copying.
  comment: >
    Files in files/ are copied verbatim to the output root without rendering.
    files/robots.txt -> /robots.txt, files/assets/css/reset.css -> /assets/css/reset.css.
  action:
    wig: build
  fixtures: []
input:
  files:
    data:
      site.yaml: |
        url: localhost
      document.yaml: |
        style: default
        layout: page.html
    styles:
      default:
        style.yaml: |
          name: default
        templates:
          layouts:
            page.html: |
              <t-slot />
    files:
      robots.txt: |
        User-agent: *
        Disallow: /admin/
      assets:
        css:
          reset.css: |
            * { margin: 0; padding: 0; }
    pages:
      _index.dj: |
        ---
        ---
        Home.
output:
  files:
    index.html: |
      <p>Home.</p>
    robots.txt: |
      User-agent: *
      Disallow: /admin/
    assets:
      css:
        reset.css: |
          * { margin: 0; padding: 0; }
