test:
  name: Frontmatter keys promoted to document.*, page.* namespace removed
  comment: >
    Top-level frontmatter keys are normalized under `document` by Wig's frontmatter
    normalizer, so they appear at `document.*` in the template context. The legacy
    `page.*` namespace no longer exists — referencing `page.title` yields nothing.
  action:
    wig: build
  fixtures: []
input:
  files:
    data:
      site.yaml: |
        url: localhost
      document.yaml: |
        style: default
        layout: page.html
    styles:
      default:
        style.yaml: |
          name: default
        templates:
          layouts:
            page.html: |
              <title><t-var name="document.title">Untitled</t-var></title>
              <author><t-var name="document.author">Unknown</t-var></author>
              <legacy><t-var name="page.title">MISSING</t-var></legacy>
              <t-slot />
    pages:
      hello.dj: |
        ---
        title: Hello World
        author: QuiteClose
        ---
        Content here.
output:
  files:
    hello:
      index.html: |
        <title>Hello World</title>
        <author>QuiteClose</author>
        <legacy>MISSING</legacy>
        <p>Content here.</p>
