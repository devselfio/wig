test:
  name: File/directory collision causes build failure
  comment: A page and directory with the same stem in the output tree collide.
  action:
    wig: build
input:
  files:
    data:
      site.yaml: |
        url: localhost
      document.yaml: |
        style: default
        layout: page.html
    styles:
      default:
        style.yaml: |
          name: default
        templates:
          layouts:
            page.html: |
              <t-slot />
    pages:
      _index.dj: |
        ---
        ---
        Home.
      blog.dj: |
        ---
        title: Blog page
        ---
        Blog as page.
      blog:
        _index.dj: |
          ---
          title: Blog section
          ---
          Blog as section.
output:
  exit: 1
