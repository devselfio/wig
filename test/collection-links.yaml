test:
  name: Collection items have path for clean URL links
  command: build
  fixtures:
    - minimal
  files:
    pages:
      _index.html: |
        ---
        style: s
        layout: page.html
        ---
        <ul>
        <t-for post in pages.posts>
        <li><a t-var:href="post.path"><t-var name="post.title" /></a></li>
        </t-for>
        </ul>
      posts:
        hello.html: |
          ---
          style: s
          layout: page.html
          title: Hello
          ---
          content
        world.html: |
          ---
          style: s
          layout: page.html
          title: World
          ---
          content
output:
  files:
    index.html: |
      <ul>
      <li><a href="/posts/world/">World</a></li>
      <li><a href="/posts/hello/">Hello</a></li>
      </ul>
