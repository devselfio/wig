test:
  name: document.style.css.path references the auto-bundled CSS file
  comment: >
    Each style's auto-bundled CSS is exposed as document.style.css.path.
    Templates use this for a single stylesheet link. The CSS file contains
    all pattern CSS wrapped in @layer blocks.
  action:
    wig: build
input:
  files:
    data:
      site.yaml: |
        url: localhost
      document.yaml: |
        style: child
        layout: page.html
    styles:
      parent:
        style.yaml: |
          name: parent
        patterns:
          resets:
            reset.html: |
              ---
              name: Reset
              ---
        css:
          resets:
            reset.css: |
              * { margin: 0; }
      child:
        style.yaml: |
          name: child
          imports:
            parent:
              patterns: "**"
        templates:
          layouts:
            page.html: |
              <link rel="stylesheet" t-var:href="document.style.css.path" />
              <t-slot />
        patterns:
          blocks:
            surface.html: |
              ---
              name: Surface
              ---
        css:
          blocks:
            surface.css: |
              body { color: #333; }
    pages:
      _index.dj: |
        ---
        ---
        Hello.
output:
  files:
    index.html: true
    assets:
      css:
        styles:
          child.*.css: true
