test:
  name: Style-scoped data directory loaded into styles.{name}.* namespace
  comment: >
    Files under styles/{name}/data/ extend the style namespace. Nested
    directories create nested keys. Data files must not overwrite engine-managed
    keys (patterns, imports). Patterns are now in patterns/ directory,
    not data/patterns/.
  action:
    wig: build
  fixtures: []
input:
  files:
    data:
      site.yaml: |
        url: localhost
      document.yaml: |
        style: default
        layout: page.html
    styles:
      default:
        style.yaml: |
          name: default
        data:
          meta.yaml: |
            version: "2.0"
            license: MIT
          patterns.yaml: |
            should: be ignored
        patterns:
          globals:
            surface.html: |
              ---
              name: Surface
              ---
        css:
          globals:
            surface.css: |
              body { margin: 0; }
        templates:
          layouts:
            page.html: |
              <version><t-var name="document.style.meta.version" /></version>
              <license><t-var name="document.style.meta.license" /></license>
              <ignored><t-var name="document.style.should">not overwritten</t-var></ignored>
              <t-slot />
    pages:
      _index.dj: |
        ---
        ---
        Hello.
output:
  files:
    index.html: |
      <version>2.0</version>
      <license>MIT</license>
      <ignored>not overwritten</ignored>
      <p>Hello.</p>
