test:
  name: HTML content page (no Djot).
  comment: Verifies HTML content renders without requiring zjot.
  action:
    wig: build
  fixtures: []
input:
  files:
    data:
      site.yaml: |
        url: localhost
      document.yaml: |
        style: default
        layout: page.html
    styles:
      default:
        style.yaml: |
          name: default
        templates:
          layouts:
            page.html: |
              <!DOCTYPE html>
              <html lang="en">
                <head>
                  <meta charset="utf-8">
                  <title><t-var name="document.title">Untitled</t-var></title>
                </head>
                <body>
                  <t-slot />
                </body>
              </html>
    pages:
      _index.html: |
        ---
        title: HTML Page
        ---
        <h1>Hello from HTML</h1>
        <p>No Djot here.</p>
output:
  files:
    index.html: |
      <!DOCTYPE html>
      <html lang="en">
        <head>
          <meta charset="utf-8">
          <title>HTML Page</title>
        </head>
        <body>
          <h1>Hello from HTML</h1>
          <p>No Djot here.</p>
        </body>
      </html>
