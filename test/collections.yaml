test:
  name: Directory-based collections sorted by filename descending
  command: build
  fixtures:
    - minimal
  files:
    pages:
      _index.html: |
        ---
        style: s
        layout: page.html
        ---
        <t-for post in pages.posts><t-var name="post.title" />,</t-for>
      posts:
        a-first.html: |
          ---
          style: s
          layout: page.html
          title: First
          ---
          A
        b-second.html: |
          ---
          style: s
          layout: page.html
          title: Second
          ---
          B
output:
  files:
    index.html: "Second,First,"
    posts/a-first/index.html: A
    posts/b-second/index.html: B
