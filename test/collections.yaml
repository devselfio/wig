    ---
    style: s
    layout: page.html
    ---
    <t-for post in pages.posts><t-var name="post.title" />,</t-for>
  posts/a-first.html: |
    ---
    style: s
    layout: page.html
    title: First
    ---
    A
  posts/b-second.html: |
    ---
    style: s
    layout: page.html
    title: Second
    ---
    B

_output:
  index.html: |
    Second,First,
  posts/a-first/index.html: A
  posts/b-second/index.html: B
