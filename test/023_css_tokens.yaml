test:
  name: Fluid design tokens in CSS via Toupee.
  comment: CSS bundle renders computed token steps into clamp() custom properties.
  action:
    wig: build
  fixtures: []
input:
  files:
    data:
      site.yaml: |
        url: localhost
      document.yaml: |
        style: default
        layout: page.html
    styles:
      default:
        style.yaml: |
          name: default
          tokens:
            viewport:
              min: 320
              max: 1240
            typography:
              base:
                min: 16
                max: 20
              scale:
                min: 1.25
                max: 1.25
              steps:
                above: 5
                below: 2
            spacing:
              negative: [0.75, 0.5, 0.25]
              positive: [1.5, 2, 3, 4, 6]
          bundles:
            css:
              tokens:
                - css/tokens.css
        templates:
          layouts:
            page.html: |
              <t-slot />
        css:
          tokens.css: |
            ---
            ---
            :root {
            <t-for step in styles.default.tokens.computed.typography>
              --size-<t-var name="step.name" />: <t-var name="step.value" />;
            </t-for>
            }
    pages:
      _index.dj: |
        ---
        ---
        Home.
output:
  files:
    index.html: |
      <p>Home.</p>
    assets:
      default:
        css:
          tokens.*.css: true
