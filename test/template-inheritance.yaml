test:
  name: Template extend chain with named slots and defaults
  command: build
  fixtures:
    - minimal
  files:
    styles:
      s:
        layouts:
          base.html: |
            <html>
            <head><title><t-slot name="title">Default Title</t-slot></title></head>
            <body><t-slot name="body" /></body>
            </html>
          page.html: |
            <t-extend template="base.html">
            <t-define name="body"><main><t-slot /></main></t-define>
            </t-extend>
          post.html: |
            <t-extend template="page.html">
            <t-define name="title"><t-var name="page.title" /> | Test</t-define>
            </t-extend>
    pages:
      about.html: |
        ---
        style: s
        layout: page.html
        title: About
        ---
        <p>About us</p>
      posts/hello.html: |
        ---
        style: s
        layout: post.html
        title: Hello World
        ---
        <p>First post</p>
output:
  files:
    about/index.html: |
      <html>
      <head><title>Default Title</title></head>
      <body><main><p>About us</p></main></body>
      </html>
    posts/hello/index.html: |
      <html>
      <head><title>Hello World | Test</title></head>
      <body><main><p>First post</p></main></body>
      </html>
