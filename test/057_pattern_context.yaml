test:
  name: Pattern context tree with category items and flat all list
  comment: >
    styles.{name}.patterns exposes a tree: each category has named patterns
    and an items list. A flat all list with composite category/id slugs
    is available for pagination. document.style.css.path points to the
    auto-bundled CSS file.
  action:
    wig: build
input:
  files:
    data:
      site.yaml: |
        url: localhost
      document.yaml: |
        style: default
        layout: page.html
    styles:
      default:
        style.yaml: |
          name: default
        templates:
          layouts:
            page.html: |
              <css><t-if var="document.style.css.path">yes</t-if></css>
              <blocks><t-for p in document.style.patterns.blocks.items><t-var name="p.name" />,</t-for></blocks>
              <comps><t-for p in document.style.patterns.compositions.items><t-var name="p.name" />,</t-for></comps>
              <all><t-for p in document.style.patterns.all><t-var name="p.slug" />,</t-for></all>
              <t-slot />
        patterns:
          compositions:
            stack.html: |
              ---
              name: Stack
              ---
              <div class="stack">items</div>
            center.html: |
              ---
              name: Center
              ---
              <div class="center">centered</div>
          blocks:
            button.html: |
              ---
              name: Button
              ---
              <button class="button">Click</button>
            tag.html: |
              ---
              name: Tag
              ---
              <span class="tag">Label</span>
        css:
          compositions:
            stack.css: |
              .stack > * + * { margin-block-start: 1em; }
            center.css: |
              .center { margin-inline: auto; }
          blocks:
            button.css: |
              .button { display: inline-flex; }
            tag.css: |
              .tag { display: inline-block; }
    pages:
      _index.dj: |
        ---
        ---
        Hello.
output:
  files:
    index.html: true
    assets:
      css:
        styles:
          default.*.css: true
