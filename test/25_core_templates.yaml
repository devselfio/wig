test:
  name: Shared _core templates available across styles
  action:
    wig: build
input:
  files:
    data:
      site.yaml: |
        url: localhost
      document.yaml: |
        style: default
        layout: page.html
    styles:
      _core:
        layouts:
          base.html: |
            <html><body><t-slot name="body" /></body></html>
      default:
        style.yaml: |
          name: default
        layouts:
          page.html: |
            <t-extend template="_core/base.html">
            <t-define name="body"><main><t-slot /></main></t-define>
            </t-extend>
    pages:
      _index.dj: |
        ---
        document:
          title: Home
        ---
        <p>Hello</p>
output:
  files:
    index.html: |
      <html><body><main><p>Hello</p></main></body></html>
