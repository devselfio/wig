test:
  name: Check detects missing site URL
  comment: A site.yaml without the required url field should produce a check error.
  action:
    wig: check
input:
  files:
    data:
      site.yaml: |
        title: My Site
      document.yaml: |
        style: default
        layout: page.html
    styles:
      default:
        style.yaml: |
          name: default
        templates:
          layouts:
            page.html: |
              <t-slot />
    pages:
      _index.dj: |
        ---
        title: Home
        ---
        Hello.
output:
  exit: 1
