test:
  name: Pagination
  comment: paginate frontmatter, context shape, URL scheme per spec.
  action:
    wig: build
input:
  files:
    data:
      site.yaml: |
        url: localhost
      document.yaml: |
        style: default
        layout: page.html
    styles:
      default:
        style.yaml: |
          name: default
        templates:
          layouts:
            page.html: |
              <t-slot />
            list.html: |
              <t-for item in paginate.items>
              <p><t-var name="item.document.title" /></p>
              </t-for>
              <t-if var="paginate.previous">
              <a t-var:href="paginate.previous.url">Prev</a>
              </t-if>
              Page <t-var name="paginate.page" /> of <t-var name="paginate.total_pages" />
              <t-if var="paginate.next">
              <a t-var:href="paginate.next.url">Next</a>
              </t-if>
    pages:
      _index.dj: |
        ---
        ---
        Home.
      posts:
        _index.dj: |
          ---
          title: Posts
          layout: list.html
          paginate:
            collection: pages.posts
            size: 2
            path: page
            alias: posts
          ---
          Blog index.
        a.dj: |
          ---
          title: Post A
          ---
          A.
        b.dj: |
          ---
          title: Post B
          ---
          B.
        c.dj: |
          ---
          title: Post C
          ---
          C.
output:
  files:
    index.html: |
      <p>Home.</p>
    posts:
      index.html: |
        
        <p>Post C</p>
        
        <p>Post B</p>
        
        
        Page 1 of 2
        
        <a href="/posts/page/2/">Next</a>
      page:
        "2":
          index.html: |
            
            <p>Post A</p>
            
            
            <a href="/posts/">Prev</a>
            
            Page 2 of 2
