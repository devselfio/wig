test:
  name: Shared cube templates available across styles
  action:
    wig: build
input:
  files:
    data:
      site.yaml: |
        url: localhost
      document.yaml: |
        style: default
        layout: page.html
    styles:
      cube:
        style.yaml: |
          name: cube
        templates:
          layouts:
            base.html: |
              <html><body><t-slot name="body" /></body></html>
      default:
        style.yaml: |
          name: default
          depends: [cube]
        templates:
          layouts:
            page.html: |
              <t-extend template="cube:layouts/base.html">
              <t-define name="body"><main><t-slot /></main></t-define>
              </t-extend>
    pages:
      _index.dj: |
        ---
        title: Home
        ---
        Hello
output:
  files:
    index.html: |
      <html><body><main><p>Hello</p></main></body></html>
