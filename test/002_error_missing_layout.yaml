test:
  name: Page referencing non-existent layout causes build failure
  action:
    wig: build
input:
  files:
    data:
      site.yaml: |
        url: localhost
      document.yaml: |
        style: default
        layout: page.html
    styles:
      default:
        style.yaml: |
          name: default
        templates:
          layouts:
            page.html: |
              <t-slot />
    pages:
      _index.dj: |
        ---
        layout: nonexistent.html
        ---
        <p>Hello</p>
output:
  exit: 1
