test:
  name: Toupee includes in content.
  comment: Tests t-include in both Djot (via {=html}) and HTML content pages.
  action:
    wig: build
  fixtures: []
input:
  files:
    data:
      site.yaml: |
        url: localhost
      document.yaml: |
        style: default
        layout: page.html
    styles:
      default:
        style.yaml: |
          name: default
        templates:
          page.html: |
            <!DOCTYPE html>
            <html lang="en">
              <head>
                <meta charset="utf-8">
                <title><t-var name="document.title">Untitled</t-var></title>
              </head>
              <body>
                <t-slot />
              </body>
            </html>
        blocks:
          callout.html: |
            <aside class="callout"><t-slot /></aside>
    pages:
      djot_page.dj: |
        ---
        document:
          title: Djot Page
        ---
        # Djot Content

        `<t-include template="blocks/callout.html">Important note.</t-include>`{=html}
      html_page.html: |
        ---
        document:
          title: HTML Page
        ---
        <h1>HTML Content</h1>
        <t-include template="blocks/callout.html">Important note.</t-include>
output:
  files:
    djot_page:
      index.html: |
        <!DOCTYPE html>
        <html lang="en">
          <head>
            <meta charset="utf-8">
            <title>Djot Page</title>
          </head>
          <body>
            <section id="Djot-Content">
            <h1>Djot Content</h1>
            <aside class="callout">Important note.</aside>
            </section>
          </body>
        </html>
    html_page:
      index.html: |
        <!DOCTYPE html>
        <html lang="en">
          <head>
            <meta charset="utf-8">
            <title>HTML Page</title>
          </head>
          <body>
            <h1>HTML Content</h1>
            <aside class="callout">Important note.</aside>
          </body>
        </html>
