test:
  name: Multi-level import chain produces correct auto-bundled CSS
  comment: >
    Three styles form an import chain: core -> mid -> theme.
    Each style's auto-bundled CSS includes its own patterns plus
    all imported patterns. CSS is wrapped in @layer blocks.
  action:
    wig: build
input:
  files:
    data:
      site.yaml: |
        url: localhost
      document.yaml: |
        style: theme
        layout: page.html
    styles:
      core:
        style.yaml: |
          name: core
        patterns:
          resets:
            reset.html: |
              ---
              name: Reset
              ---
        css:
          resets:
            reset.css: |
              * { margin: 0; }
      mid:
        style.yaml: |
          name: mid
          imports:
            core:
              patterns: "**"
        patterns:
          tokens:
            colors.html: |
              ---
              name: Colours
              ---
        css:
          tokens:
            colors.css: |
              :root { --fg: #000; }
      theme:
        style.yaml: |
          name: theme
          imports:
            mid:
              patterns: "**"
        templates:
          layouts:
            page.html: |
              <link t-var:href="document.style.css.path" />
              <t-slot />
        patterns:
          blocks:
            surface.html: |
              ---
              name: Surface
              ---
        css:
          blocks:
            surface.css: |
              body { font-family: serif; }
    pages:
      _index.dj: |
        ---
        ---
        Hello.
output:
  files:
    index.html: true
    assets:
      css:
        styles:
          core.*.css: true
          mid.*.css: true
          theme.*.css: true
