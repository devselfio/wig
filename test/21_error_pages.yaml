test:
  name: Error pages (_404, _500).
  comment: Underscore-prefixed numeric pages output without directory wrapping.
  action:
    wig: build
  fixtures: []
input:
  files:
    data:
      site.yaml: |
        url: localhost
      document.yaml: |
        style: default
        layout: page.html
    styles:
      default:
        style.yaml: |
          name: default
        templates:
          page.html: |
            <!DOCTYPE html>
            <html lang="en">
              <head>
                <meta charset="utf-8">
                <title><t-var name="document.title">Untitled</t-var></title>
              </head>
              <body>
                <t-slot />
              </body>
            </html>
    pages:
      _index.dj: |
        ---
        document:
          title: Home
        ---
        Home page.
      _404.dj: |
        ---
        document:
          title: Not Found
        ---
        Page not found.
      _500.dj: |
        ---
        document:
          title: Server Error
        ---
        Internal server error.
output:
  files:
    index.html: |
      <!DOCTYPE html>
      <html lang="en">
        <head>
          <meta charset="utf-8">
          <title>Home</title>
        </head>
        <body>
          <p>Home page.</p>
        </body>
      </html>
    404.html: |
      <!DOCTYPE html>
      <html lang="en">
        <head>
          <meta charset="utf-8">
          <title>Not Found</title>
        </head>
        <body>
          <p>Page not found.</p>
        </body>
      </html>
    500.html: |
      <!DOCTYPE html>
      <html lang="en">
        <head>
          <meta charset="utf-8">
          <title>Server Error</title>
        </head>
        <body>
          <p>Internal server error.</p>
        </body>
      </html>
