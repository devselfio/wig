test:
  name: Breadcrumbs via document.ancestors.
  comment: Tests document.ancestors with 10 levels of nesting and order="reverse" on t-for.
  action:
    wig: build
  fixtures: []
input:
  files:
    data:
      site.yaml: |
        url: localhost
      document.yaml: |
        style: default
        layout: page.html
    styles:
      default:
        style.yaml: |
          name: default
        layouts:
          page.html: |
            <!DOCTYPE html>
            <html lang="en">
              <head>
                <meta charset="utf-8">
                <title><t-var name="document.title">Untitled</t-var></title>
              </head>
              <body>
                <t-include template="blocks/breadcrumbs.html" context="document.ancestors as ancestors" />
                <t-slot />
              </body>
            </html>
        blocks:
          breadcrumbs.html: |
            <nav aria-label="Breadcrumb">
            <p>
            <t-for crumb in ancestors order="reverse" as loop>
            <t-if var="loop.first" not-exists> / </t-if>
            <a t-var:href="crumb.path"><t-var name="crumb.title" /></a>
            </t-for>
            </p>
            </nav>
    pages:
      _index.dj: |
        ---
        document:
          title: L0
        ---
        Level 0.
      a:
        _index.dj: |
          ---
          document:
            title: L1
          ---
          Level 1.
        b:
          _index.dj: |
            ---
            document:
              title: L2
            ---
            Level 2.
          c:
            _index.dj: |
              ---
              document:
                title: L3
              ---
              Level 3.
            d:
              _index.dj: |
                ---
                document:
                  title: L4
                ---
                Level 4.
              e:
                _index.dj: |
                  ---
                  document:
                    title: L5
                  ---
                  Level 5.
                f:
                  _index.dj: |
                    ---
                    document:
                      title: L6
                    ---
                    Level 6.
                  g:
                    _index.dj: |
                      ---
                      document:
                        title: L7
                      ---
                      Level 7.
                    h:
                      _index.dj: |
                        ---
                        document:
                          title: L8
                        ---
                        Level 8.
                      i:
                        _index.dj: |
                          ---
                          document:
                            title: L9
                          ---
                          Level 9.
