test:
  name: Static asset copying.
  comment: Files in assets/ are copied verbatim to output without rendering.
  action:
    wig: build
  fixtures: []
input:
  files:
    data:
      site.yaml: |
        url: localhost
      document.yaml: |
        style: default
        layout: page.html
    styles:
      default:
        style.yaml: |
          name: default
        templates:
          page.html: |
            <t-slot />
    assets:
      robots.txt: |
        User-agent: *
        Disallow: /admin/
      css:
        reset.css: |
          * { margin: 0; padding: 0; }
    pages:
      _index.dj: |
        ---
        ---
        Home.
output:
  files:
    index.html: |
      <p>Home.</p>
    assets:
      robots.txt: |
        User-agent: *
        Disallow: /admin/
      css:
        reset.css: |
          * { margin: 0; padding: 0; }
