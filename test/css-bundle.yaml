data:
  site.yaml: |
    url: https://example.com
    title: Test

styles:
  theme:
    style.yaml: |
      name: theme
      bundles:
        css:
          main.css:
            - theme/reset.css
            - theme/styles.css
    layouts:
      page.html: |
        <link rel="stylesheet" t-var:href="assets.theme.css.main.path" />
        <t-slot />
    reset.css: |
      * { margin: 0; }
    styles.css: |
      body { color: #333; }

pages:
  _index.html: |
    ---
    style: theme
    layout: page.html
    ---
    <p>Styled</p>

_output:
  css/theme/main.*.css: |
    * { margin: 0; }
    body { color: #333; }
  index.html: true
