test:
  name: Page-level layout overrides cascaded layout
  comment: >
    A page's own `layout:` frontmatter field takes precedence over a
    cascaded `data.document.layout` from a parent _index.dj. The cascade
    provides a default for children that don't specify their own layout.
  action:
    wig: build
  fixtures: []
input:
  files:
    data:
      site.yaml: |
        url: localhost
      document.yaml: |
        style: default
        layout: page.html
    styles:
      default:
        style.yaml: |
          name: default
        templates:
          layouts:
            page.html: |
              <html><body class="page"><t-slot /></body></html>
            special.html: |
              <html><body class="special"><t-slot /></body></html>
    pages:
      _index.dj: |
        ---
        title: Home
        data:
          document:
            layout: page.html
        ---
        Home page
      inherits.dj: |
        ---
        title: Inherits
        ---
        Uses cascaded layout
      overrides.dj: |
        ---
        title: Overrides
        layout: special.html
        ---
        Uses own layout
output:
  files:
    index.html: |
      <html><body class="page"><p>Home page</p></body></html>
    inherits:
      index.html: |
        <html><body class="page"><p>Uses cascaded layout</p></body></html>
    overrides:
      index.html: |
        <html><body class="special"><p>Uses own layout</p></body></html>
