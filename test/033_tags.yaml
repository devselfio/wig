test:
  name: Tags
  comment: Auto-generated tag index pages, frontmatter tags, /tags/ tree, popularity ordering, multi-tag filtering.
  action:
    wig: build
input:
  files:
    data:
      site.yaml: |
        url: localhost
        taxonomies:
          - tags
      document.yaml: |
        style: default
        layout: page.html
    styles:
      default:
        style.yaml: |
          name: default
        templates:
          layouts:
            page.html: |
              <t-slot />
            tag-index.html: |
              <h1>Tags</h1>
              <ul>
                <t-for t in tag.tags>
                  <li><a t-var:href="t.path"><t-var name="t.name" /></a> (<t-var name="t.count" />)</li>
                </t-for>
              </ul>
            tag-list.html: |
              <h1><t-var name="tag.document.title" /></h1>
              <p>Path tags: <t-var name="tag.path_tags" /></p>
              <ul>
                <t-for doc in tag.documents>
                  <li><a t-var:href="doc.document.path"><t-var name="doc.document.title" /></a></li>
                </t-for>
              </ul>
              <p>Add tag:</p>
              <ul>
                <t-for t in tag.tags>
                  <li><a t-var:href="t.path"><t-var name="t.name" /></a></li>
                </t-for>
              </ul>
    pages:
      _index.dj: |
        ---
        ---
        Home.
      blog:
        a.dj: |
          ---
          title: Doc A
          tags: [music, tech]
          ---
          A.
        b.dj: |
          ---
          title: Doc B
          tags: [music]
          ---
          B.
        c.dj: |
          ---
          title: Doc C
          tags: [tech]
          ---
          C.
        d.dj: |
          ---
          title: Doc D
          tags: [tech, zig]
          ---
          D.
output:
  files:
    index.html: |
      <p>Home.</p>
    tags:
      index.html: |
        <h1>Tags</h1>
        <ul>
          
            <li><a href="/tags/tech/">tech</a> (3)</li>
          
            <li><a href="/tags/music/">music</a> (2)</li>
          
            <li><a href="/tags/zig/">zig</a> (1)</li>
          
        </ul>
      tech:
        index.html: |
          <h1>tech</h1>
          <p>Path tags: tech</p>
          <ul>
            
              <li><a href="/blog/c/">Doc C</a></li>
            
              <li><a href="/blog/d/">Doc D</a></li>
            
              <li><a href="/blog/a/">Doc A</a></li>
            
          </ul>
          <p>Add tag:</p>
          <ul>
            
              <li><a href="/tags/tech/">tech</a></li>
            
              <li><a href="/tags/music/">music</a></li>
            
              <li><a href="/tags/zig/">zig</a></li>
            
          </ul>
        music:
          index.html: |
            <h1>tech/music</h1>
            <p>Path tags: tech/music</p>
            <ul>
              
                <li><a href="/blog/a/">Doc A</a></li>
              
            </ul>
            <p>Add tag:</p>
            <ul>
              
                <li><a href="/tags/tech/">tech</a></li>
              
                <li><a href="/tags/music/">music</a></li>
              
                <li><a href="/tags/zig/">zig</a></li>
              
            </ul>
      music:
        index.html: |
          <h1>music</h1>
          <p>Path tags: music</p>
          <ul>
            
              <li><a href="/blog/b/">Doc B</a></li>
            
              <li><a href="/blog/a/">Doc A</a></li>
            
          </ul>
          <p>Add tag:</p>
          <ul>
            
              <li><a href="/tags/tech/">tech</a></li>
            
              <li><a href="/tags/music/">music</a></li>
            
              <li><a href="/tags/zig/">zig</a></li>
            
          </ul>
      zig:
        index.html: |
          <h1>zig</h1>
          <p>Path tags: zig</p>
          <ul>
            
              <li><a href="/blog/d/">Doc D</a></li>
            
          </ul>
          <p>Add tag:</p>
          <ul>
            
              <li><a href="/tags/tech/">tech</a></li>
            
              <li><a href="/tags/music/">music</a></li>
            
              <li><a href="/tags/zig/">zig</a></li>
            
          </ul>
