test:
  name: document.excerpt and document.thumbnail.
  comment: Tests excerpt from description, fallback to first paragraph, and thumbnail path.
  action:
    wig: build
  fixtures: []
input:
  files:
    data:
      site.yaml: |
        url: localhost
      document.yaml: |
        style: default
        layout: page.html
    styles:
      default:
        style.yaml: |
          name: default
        templates:
          page.html: |
            <meta name="description" t-var:content="document.excerpt" />
            <t-if var="document.thumbnail">
            <meta property="og:image" t-var:content="document.thumbnail" />
            </t-if>
            <t-slot />
    pages:
      _index.dj: |
        ---
        document:
          title: With Description
          description: A custom excerpt from frontmatter.
          thumbnail: /images/hero.jpg
        ---
        This first paragraph is NOT the excerpt.

        Second paragraph.
      no_desc.dj: |
        ---
        document:
          title: Without Description
        ---
        This first paragraph IS the excerpt.

        Second paragraph.
output:
  files:
    index.html: |
      <meta name="description" content="A custom excerpt from frontmatter." />
      <meta property="og:image" content="/images/hero.jpg" />
      <p>This first paragraph is NOT the excerpt.</p>
      <p>Second paragraph.</p>
    no_desc:
      index.html: |
        <meta name="description" content="This first paragraph IS the excerpt." />
        <p>This first paragraph IS the excerpt.</p>
        <p>Second paragraph.</p>
