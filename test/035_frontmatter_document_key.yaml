test:
  name: Root title vs nested document.title in frontmatter
  comment: >
    Every YAML root key K maps to document.K. A root key named `document` therefore becomes
    document.document (not a shortcut for page fields). mixed.dj: title at root vs nested
    document.title. simple.dj: only root document: { title } → document.title absent (Untitled),
    value at document.document.title. Djot uses typographic quotes in HTML.
  action:
    wig: build
  fixtures: []
input:
  files:
    data:
      site.yaml: |
        url: localhost
      document.yaml: |
        style: default
        layout: page.html
    styles:
      default:
        style.yaml: |
          name: default
        templates:
          layouts:
            page.html: |
              <!DOCTYPE html>
              <html lang="en">
                <head>
                  <meta charset="utf-8">
                  <title><t-var name="document.title">Untitled</t-var></title>
                </head>
                <body>
                  <t-slot />
                </body>
              </html>
    pages:
      mixed.dj: |
        ---
        title: Actual
        document:
          title: Fake
        ---
        This document is titled "{{ document.title }}", not "{{ document.document.title }}"
      simple.dj: |
        ---
        document:
          title: Fake
        ---
        This document is titled "{{ document.title }}", not "{{ document.document.title }}"
output:
  files:
    mixed:
      index.html: |
        <!DOCTYPE html>
        <html lang="en">
          <head>
            <meta charset="utf-8">
            <title>Actual</title>
          </head>
          <body>
            <p>This document is titled “Actual”, not “Fake”</p>
          </body>
        </html>
    simple:
      index.html: |
        <!DOCTYPE html>
        <html lang="en">
          <head>
            <meta charset="utf-8">
            <title>Untitled</title>
          </head>
          <body>
            <p>This document is titled ““, not “Fake”</p>
          </body>
        </html>
