test:
  name: Import merges upstream CSS into auto-bundled output
  comment: >
    When a child style imports patterns from a base style, the CSS from
    imported patterns is included in the child's auto-bundled output.
    Each style produces its own hashed CSS file at assets/css/styles/.
  action:
    wig: build
input:
  files:
    data:
      site.yaml: |
        url: localhost
      document.yaml: |
        style: child
        layout: page.html
    styles:
      base:
        style.yaml: |
          name: base
        patterns:
          resets:
            reset.html: |
              ---
              name: Reset
              ---
        css:
          resets:
            reset.css: |
              * { margin: 0; }
      child:
        style.yaml: |
          name: child
          imports:
            base:
              patterns: "**"
        templates:
          layouts:
            page.html: |
              <t-slot />
        patterns:
          blocks:
            surface.html: |
              ---
              name: Surface
              ---
        css:
          blocks:
            surface.css: |
              body { color: #333; }
    pages:
      _index.dj: |
        ---
        ---
        Hello.
output:
  files:
    index.html: |
      <p>Hello.</p>
    assets:
      css:
        styles:
          base.*.css: true
          child.*.css: true
