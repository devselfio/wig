test:
  name: Sitemap generation.
  comment: Tests sitemap.xml with loc for all pages and lastmod for pages with dates.
  action:
    wig: build
  fixtures: []
input:
  files:
    data:
      site.yaml: |
        url: https://example.com
      document.yaml: |
        style: default
        layout: page.html
    styles:
      default:
        style.yaml: |
          name: default
        layouts:
          page.html: |
            <t-slot />
    pages:
      _index.dj: |
        ---
        title: Home
        date: 2026-03-01
        ---
        Home.
      about.dj: |
        ---
        title: About
        ---
        About.
      blog:
        _index.dj: |
          ---
          title: Blog
          date: 2026-03-10
          ---
          Blog.
output:
  files:
    index.html: |
      <p>Home.</p>
    about:
      index.html: |
        <p>About.</p>
    blog:
      index.html: |
        <p>Blog.</p>
    sitemap.xml: |
      <?xml version="1.0" encoding="UTF-8"?>
      <urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">
        <url>
          <loc>https://example.com/</loc>
          <lastmod>2026-03-01</lastmod>
        </url>
        <url>
          <loc>https://example.com/about/</loc>
        </url>
        <url>
          <loc>https://example.com/blog/</loc>
          <lastmod>2026-03-10</lastmod>
        </url>
      </urlset>
