test:
  name: CSS auto-bundling with @layer wrapping from patterns
  comment: >
    Patterns drive CSS collection. Each category's CSS is wrapped in an @layer
    block. The output file is at assets/css/styles/{style}.{hash}.css.
    document.style.css.path provides the path.
  action:
    wig: build
input:
  files:
    data:
      site.yaml: |
        url: localhost
      document.yaml: |
        style: default
        layout: page.html
    styles:
      default:
        style.yaml: |
          name: default
        templates:
          layouts:
            page.html: |
              <link rel="stylesheet" t-var:href="document.style.css.path" />
              <t-slot />
        patterns:
          resets:
            reset.html: |
              ---
              name: Reset
              ---
          globals:
            document.html: |
              ---
              name: Document
              ---
              <p>Body text</p>
        css:
          resets:
            reset.css: |
              * { margin: 0; }
          globals:
            document.css: |
              body { color: #333; }
    pages:
      _index.dj: |
        ---
        ---
        <p>Styled</p>
output:
  files:
    index.html: true
    assets:
      css:
        styles:
          default.*.css: true
