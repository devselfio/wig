test:
  name: Draft page excluded from build.
  comment: Pages with document.draft true are excluded from wig build output.
  action:
    wig: build
  fixtures: []
input:
  files:
    data:
      site.yaml: |
        url: localhost
      document.yaml: |
        style: default
        layout: page.html
    styles:
      default:
        style.yaml: |
          name: default
        layouts:
          page.html: |
            <t-var name="document.title" />
    pages:
      _index.dj: |
        ---
        document:
          title: Home
        ---
        Home.
      published.dj: |
        ---
        document:
          title: Published
        ---
        Published page.
      draft.dj: |
        ---
        document:
          title: Draft
          draft: true
        ---
        Draft page.
output:
  files:
    index.html: |
      Home
    published:
      index.html: |
        Published
---
test:
  name: Draft page included with --draft flag.
  comment: Pages with document.draft true are included when --draft is passed.
  action:
    wig: build --draft
  fixtures: []
input:
  files:
    data:
      site.yaml: |
        url: localhost
      document.yaml: |
        style: default
        layout: page.html
    styles:
      default:
        style.yaml: |
          name: default
        layouts:
          page.html: |
            <t-var name="document.title" />
    pages:
      _index.dj: |
        ---
        document:
          title: Home
        ---
        Home.
      published.dj: |
        ---
        document:
          title: Published
        ---
        Published page.
      draft.dj: |
        ---
        document:
          title: Draft
          draft: true
        ---
        Draft page.
output:
  files:
    index.html: |
      Home
    published:
      index.html: |
        Published
    draft:
      index.html: |
        Draft
