test:
  name: Page referencing non-existent style causes build failure
  comment: A style name in frontmatter or data cascade that has no matching styles/ directory.
  action:
    wig: build
input:
  files:
    data:
      site.yaml: |
        url: localhost
      document.yaml: |
        style: nonexistent
        layout: page.html
    styles:
      default:
        style.yaml: |
          name: default
        templates:
          layouts:
            page.html: |
              <t-slot />
    pages:
      _index.dj: |
        ---
        ---
        Home.
output:
  exit: 1
  diagnostics:
    - kind: error
      contains: "nonexistent/templates/layouts/page.html"
